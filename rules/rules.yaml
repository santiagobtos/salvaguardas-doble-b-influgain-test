# Reglas de negocio editables — Salvaguardas Doble B
# Este archivo se recarga en cada request. Para cambiar el comportamiento del
# agente de pre-calificación o del CRM NO toques el código, edita esto.

# Si el mensaje contiene alguna de estas palabras, SIEMPRE se escala a un humano,
# sin importar lo demás (riesgo legal, seguridad, o casos ambiguos).
escalar_keywords:
  - "demanda"
  - "abogado"
  - "embargo"
  - "suicid"
  - "amenaza"
  - "denuncia"
  - "fraude"
  - "urgente"
  - "quiebra"
  - "no entiendo"

# Si el mensaje contiene alguna de estas palabras, se ignora (el lead se
# está dando de baja o no quiere seguir).
ignorar_keywords:
  - "no me interesa"
  - "quitame"
  - "quítame"
  - "stop"
  - "baja"
  - "spam"
  - "no volver a escribir"

# Umbrales de monto de deuda (en COP). Fuera de este rango se escala a
# revisión manual: montos muy bajos no son rentables para el partner,
# montos muy altos son casos atípicos que requieren criterio humano.
deuda:
  monto_minimo: 1000000
  monto_maximo_auto: 80000000

# Palabras clave para inferir el tipo de deuda mencionado en el mensaje.
palabras_tipo_deuda:
  tarjeta_credito: ["tarjeta", "tdc", "credito de tarjeta"]
  libranza: ["libranza", "nomina"]
  libre_inversion: ["libre inversion", "credito de consumo", "libre inversión"]
  hipotecario: ["hipoteca", "casa", "vivienda"]

# Palabras que indican que el lead quiere hablar con un Consejero.
consejero_interes_keywords:
  - "consejero"
  - "asesoria"
  - "asesoría"
  - "ayuda"
  - "programa"
  - "quiero inscribirme"
  - "informacion"
  - "información"

# Un lead pre-calificado (Respondido/Escalado) sin avanzar a una
# inscripción en más de este número de días se considera "estancado" en
# el reporting (Ejercicio C). 2 días ≈ 48 horas.
leads_estancados_dias: 2

# Tasa de comisión usada SOLO para el reporte interno de ROI por
# creador/canal del Ejercicio C (Performance por Creador/Canal) — una
# aproximación para priorizar internamente, nunca un número que se le
# promete al lead ni al creador.
comision_pct_estimada: 20

# Ejercicio D: "Fuentes de contenido" (8-12 ítems: preguntas de leads,
# objeciones o tendencias) — igual que pedía el enunciado original, pero en
# vez de inventarlas a mano, cada una se mide sobre los mensajes REALES de
# data/leads.csv. Cada mensaje se clasifica en la PRIMERA fuente de esta
# lista cuyas keywords aparecen en el texto — así un lead con varias
# señales no se cuenta dos veces. La última fuente debe quedar con
# keywords vacías: es el catch-all para lo que no matcheó antes. `guion`
# agrupa varias fuentes en uno de los 3 guiones finales (friccion_informacion
# / deuda_tarjeta_consumo / riesgo_y_desconfianza) para que cada guion tenga
# evidencia suficiente (mínimo 12 leads). Cambiar esto cambia de qué habla
# el Ejercicio D sin tocar código.
categorias_contenido:
  - id: riesgo_legal
    nombre: "Riesgo legal explícito (demanda, embargo, amenaza, quiebra)"
    guion: riesgo_y_desconfianza
    keywords: ["demanda", "abogado", "embargo", "amenaza", "quiebra", "fraude", "denuncia"]
  - id: abandono_desconfianza
    nombre: "Se quieren dar de baja o sienten que esto es spam"
    guion: riesgo_y_desconfianza
    keywords: ["no me interesa", "quitame", "quítame", "dame de baja", "dejen de escribir", "spam", "no vuelvan a escribir"]
  - id: info_general
    nombre: "Piden información del programa sin dar el siguiente paso"
    guion: friccion_informacion
    keywords: ["informacion", "información", "consejeria", "consejería", "como funciona", "cómo funciona", "contar mas", "contar más"]
  - id: tarjeta_credito
    nombre: "Deuda de tarjeta de crédito"
    guion: deuda_tarjeta_consumo
    keywords: ["tarjeta", "tdc"]
  - id: libre_inversion_consumo
    nombre: "Crédito de consumo o libre inversión"
    guion: deuda_tarjeta_consumo
    keywords: ["consumo", "libre inversion", "libre inversión"]
  - id: varias_deudas
    nombre: "Varias deudas juntas, no saben por dónde empezar"
    guion: deuda_tarjeta_consumo
    keywords: ["varias deudas"]
  - id: libranza_nomina
    nombre: "Deuda de libranza/nómina, piden asesoría puntual"
    guion: riesgo_y_desconfianza
    keywords: ["libranza", "nomina", "nómina"]
  - id: hipotecario
    nombre: "Deuda hipotecaria, riesgo de perder la vivienda"
    guion: riesgo_y_desconfianza
    keywords: ["hipoteca", "hipotecaria"]
  - id: otros
    nombre: "Otros (sin patrón claro todavía)"
    guion: riesgo_y_desconfianza
    keywords: []
